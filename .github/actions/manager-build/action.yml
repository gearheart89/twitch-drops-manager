name: Build and verify manager
description: Build the image, then run isolated synthetic checks before publishing
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        load: true
        push: false
        platforms: linux/amd64
        tags: twitch-drops-manager:ci
        provenance: false
        cache-from: type=gha,scope=manager-amd64
        cache-to: type=gha,scope=manager-amd64,mode=max
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
    - name: Verify the built image offline
      shell: bash
      run: sh .github/scripts/check-manager-image.sh twitch-drops-manager:ci
