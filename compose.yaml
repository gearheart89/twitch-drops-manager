name: twitch-drops
services:
  manager:
    image: ${IMAGE:-ghcr.io/gearheart89/twitch-drops-manager:latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    shm_size: 512m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-America/Chicago}
    volumes:
      - manager-data:/data
    secrets:
      - account_key
    tmpfs:
      - /runtime:rw,nosuid,nodev,mode=0700,size=512m
      - /tmp:rw,nosuid,nodev,mode=1777,size=1g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_manager/health', timeout=10)"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3
volumes:
  manager-data:
secrets:
  account_key:
    file: ./.secrets/account-key
