<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create password · Drops</title><link rel="icon" type="image/svg+xml" href="/_manager/icon.svg"><link rel="stylesheet" href="/_manager/style.css"><script defer src="/_manager/setup.js"></script></head><body class="login-page"><main class="login-card"><img class="mark" src="/_manager/icon.svg" alt=""><span class="eyebrow">FIRST-TIME SETUP</span><h1>Make it yours.</h1><p>Create a password to protect your accounts and rewards dashboard.</p><form id="setup-form"><label for="password">Dashboard password</label><input id="password" type="password" autocomplete="new-password" minlength="16" maxlength="1024" required autofocus><label for="confirmation">Confirm password</label><input id="confirmation" type="password" autocomplete="new-password" minlength="16" maxlength="1024" required><button class="primary" id="create-password">Create password</button><p id="error" class="error" role="alert" hidden></p></form><p class="login-note">Use at least 16 characters. You can change this password in the dashboard later. Your Twitch login is entered separately.</p></main></body></html>
